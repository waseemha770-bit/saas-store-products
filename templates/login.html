<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة TajerGo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- دالة الطوارئ الذكية لفك حظر الصور المحجوبة فقط -->
    <script>function fixImg(img){if(!img.dataset.proxied){img.dataset.proxied='true';let src=img.getAttribute('src');if(src&&src!==''&&!src.includes('placeholder')){img.src='https://wsrv.nl/?url='+encodeURIComponent(img.src);}}}</script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-wrapper { width: 100%; max-width: 400px; padding: 15px; }
        .login-card { background: #fff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); text-align: center; border: 1px solid #eaeaea; }
        .platform-logo { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin-bottom: 20px; border: 3px solid #0d6efd; padding: 3px; box-shadow: 0 5px 15px rgba(13, 110, 253, 0.2); }
        .form-control { border-radius: 12px; padding: 12px 15px; border: 2px solid #e9ecef; font-weight: bold; background-color: #f8f9fa; transition: all 0.3s; }
        .form-control:focus { border-color: #0d6efd; background-color: #fff; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1); }
        .btn-login { border-radius: 12px; padding: 12px; font-weight: bold; font-size: 1.1rem; transition: all 0.3s; }
        .input-group-text { border: 2px solid #e9ecef; border-left: none; background-color: #f8f9fa; border-radius: 0 12px 12px 0; }
        .form-control { border-right: none; border-radius: 12px 0 0 12px !important; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- استدعاء دالة الطوارئ عند فشل التحميل -->
            <img src="{{ platform_logo }}" onerror="fixImg(this)" class="platform-logo" alt="شعار المنصة">
            <h4 class="fw-bold mb-1 text-dark">منصة TajerGo</h4>
            <p class="text-muted mb-4 small fw-bold">بوابة الدخول وإدارة المتاجر</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }} small fw-bold py-2 rounded-3">{{ message }}</div>{% endfor %}{% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3 text-start"><label class="small fw-bold text-muted ms-1 mb-1">رابط المتجر</label><div class="input-group"><span class="input-group-text"><i class="fas fa-store text-muted"></i></span><input type="text" name="slug" class="form-control" placeholder="مثال: admin-store" required></div></div>
                <div class="mb-4 text-start"><label class="small fw-bold text-muted ms-1 mb-1">كلمة المرور</label><div class="input-group"><span class="input-group-text"><i class="fas fa-lock text-muted"></i></span><input type="password" name="pass" class="form-control" placeholder="••••••••" required></div></div>
                <button type="submit" class="btn btn-primary w-100 btn-login"><i class="fas fa-sign-in-alt ms-1"></i> دخول للوحة التحكم</button>
            </form>
        </div>
    </div>

<!-- ============================================== -->
<!-- ⚡ DYNAMIC JS INJECTION: ADVANCED FIELDS ⚡ -->
<!-- ============================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    function injectAdvancedFields() {
        // البحث عن أي فورم أو نافذة منبثقة تتعلق بالمنتجات
        let forms = document.querySelectorAll('form');
        forms.forEach(form => {
            // نتأكد أن الفورم خاص بالمنتجات (يحتوي على حقل السعر مثلاً)
            if (form.querySelector('input[name="price"]') && !form.querySelector('.dynamic-adv-fields')) {
                
                let advBox = document.createElement('div');
                advBox.className = 'dynamic-adv-fields col-12 mt-4 mb-3 w-100 p-3 bg-light rounded border border-info shadow-sm';
                advBox.style.borderRight = '4px solid #0dcaf0';
                
                advBox.innerHTML = `
                    <h6 class="text-info mb-3 fw-bold"><i class="fas fa-tags"></i> خصائص إضافية (اختياري)</h6>
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">التصنيف الفرعي</label>
                            <input type="text" name="subcategory" class="form-control form-control-sm" placeholder="مثال: هواتف">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">الماركة / الموديل</label>
                            <input type="text" name="brand" class="form-control form-control-sm" placeholder="مثال: سامسونج">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">النوع / الخصائص</label>
                            <input type="text" name="p_type" class="form-control form-control-sm" placeholder="مثال: 128GB">
                        </div>
                    </div>
                `;

                // البحث عن زر الإرسال أو الإغلاق لنزرع الصندوق قبله مباشرة
                let submitBtn = form.querySelector('button[type="submit"], input[type="submit"]');
                let priceInput = form.querySelector('input[name="price"]');
                
                if (submitBtn) {
                    submitBtn.parentNode.insertBefore(advBox, submitBtn);
                } else if (priceInput) {
                    priceInput.parentNode.appendChild(advBox);
                } else {
                    form.appendChild(advBox);
                }
            }
        });
    }

    // التنفيذ الفوري عند فتح الصفحة
    injectAdvancedFields();

    // التنفيذ المستمر (مراقبة): لمواجهة النوافذ المنبثقة التي تفتح بعد التحميل
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length) {
                injectAdvancedFields();
            }
        });
    });
    observer.observe(document.body, { childList: true, subtree: true });
});
</script>
<!-- ============================================== -->


    <script>
    // 🧨 كود إجبار المتصفح على جلب النسخة الجديدة وتدمير الكاش القديم
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
                registration.update();
            }
        });
    }
    </script>
    
</body>
</html>
