<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - TajerGo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
    <form method="POST" class="container mt-5 p-4 bg-white shadow rounded" style="max-width:400px;">
        <h2 class="text-center mb-4">تسجيل الدخول</h2>
        <input name="slug" class="form-control mb-3" placeholder="اسم المتجر (Slug)" required>
        <input name="pass" type="password" class="form-control mb-3" placeholder="كلمة المرور" required>
        <button class="btn btn-primary w-100">دخول</button>
    </form>
</body>
</html>
