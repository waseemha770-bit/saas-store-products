<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ settings.store_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family={{ settings.font_family|default('Cairo') }}:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        :root { --main-color: {{ settings.theme_color|default('#0d6efd') }}; }
        body { font-family: '{{ settings.font_family|default('Cairo') }}', sans-serif; background-color: #f9fbfd; padding-bottom: 80px; }
        .hero-section { background: linear-gradient(135deg, var(--main-color), #2b2b2b); color: white; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 60px 0; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; margin-bottom: 40px;}
        .product-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .product-img { height: 200px; object-fit: cover; width: 100%; border-top-left-radius: 15px; border-top-right-radius: 15px;}
        .btn-custom { background-color: var(--main-color); color: white; font-weight: bold; }
        /* السلة العائمة */
        #floating-cart { position: fixed; bottom: 20px; left: 20px; background-color: var(--main-color); color: white; border-radius: 50px; padding: 15px 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; z-index: 1000; font-weight: bold; font-size: 1.1rem; display: none;}
    </style>
</head>
<body>
    <div class="hero-section">
        <h1 class="fw-bold">{{ settings.store_name }}</h1>
        <p>{{ settings.store_desc }}</p>
    </div>

    <div class="container">
        <div class="row">
            {% for p in products %}
            <div class="col-md-3 col-6 mb-4">
                <div class="card product-card">
                    <img src="{{ p.image_url if p.image_url else 'https://via.placeholder.com/400x300?text=بدون+صورة' }}" class="product-img">
                    <div class="card-body p-3">
                        <h6 class="fw-bold text-truncate">{{ p.name }}</h6>
                        <h5 class="text-primary fw-bold">{{ p.price }} <small>{{ settings.currency }}</small></h5>
                        <button class="btn btn-custom w-100 mt-2 btn-sm" onclick="addToCart('{{ p.name }}', {{ p.price }})">🛒 أضف للسلة</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- السلة العائمة -->
    <div id="floating-cart" onclick="openCart()">
        🛒 السلة (<span id="cart-count">0</span>) - <span id="cart-total">0</span> {{ settings.currency }}
    </div>

    <!-- نافذة الدفع (Modal) -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title fw-bold">إتمام الطلب</h5></div>
                <div class="modal-body">
                    <ul id="cart-items" class="list-group mb-3"></ul>
                    <hr>
                    <h5 class="fw-bold text-start mb-3">الإجمالي: <span id="modal-total" class="text-primary">0</span> {{ settings.currency }}</h5>
                    <input type="text" id="customer-name" class="form-control mb-2" placeholder="اسمك الكريم" required>
                    <input type="text" id="customer-phone" class="form-control mb-3" placeholder="رقم هاتفك للتواصل" required>
                    <button class="btn btn-success w-100 fw-bold" onclick="checkout()">إرسال الطلب عبر الواتساب 💬</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cart = [];
        
        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if(item) { item.qty++; } else { cart.push({name: name, price: price, qty: 1}); }
            updateCart();
            alert("تم إضافة " + name + " إلى السلة!");
        }

        function updateCart() {
            let count = 0; let total = 0;
            cart.forEach(item => { count += item.qty; total += (item.price * item.qty); });
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
            document.getElementById('modal-total').innerText = total;
            document.getElementById('floating-cart').style.display = count > 0 ? 'block' : 'none';
        }

        function openCart() {
            let list = document.getElementById('cart-items');
            list.innerHTML = '';
            cart.forEach((item, index) => {
                list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    ${item.name} (x${item.qty}) <span class="badge bg-primary rounded-pill">${item.price * item.qty}</span>
                </li>`;
            });
            new bootstrap.Modal(document.getElementById('cartModal')).show();
        }

        function checkout() {
            let name = document.getElementById('customer-name').value;
            let phone = document.getElementById('customer-phone').value;
            if(!name || !phone) return alert("يرجى إدخال الاسم ورقم الهاتف");
            
            let total = document.getElementById('modal-total').innerText;
            
            fetch('/api/checkout/{{ user.store_slug }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, phone: phone, cart: cart, total: total})
            })
            .then(res => res.json())
            .then(data => {
                cart = []; updateCart();
                window.location.href = data.whatsapp_url;
            });
        }
    </script>
</body>
</html>
