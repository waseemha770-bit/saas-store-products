<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.store_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family={{ settings.font_family|default('Cairo') }}:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        :root { --main-color: {{ settings.theme_color|default('#0d6efd') }}; }
        body { font-family: '{{ settings.font_family|default('Cairo') }}', sans-serif; background-color: #f9fbfd; padding-bottom: 80px; }
        
        {% if settings.header_size == 'small' %} .hero-section { padding: 40px 0; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 30px; } .hero-title { font-size: 2rem; }
        {% elif settings.header_size == 'large' %} .hero-section { padding: 120px 0; border-bottom-left-radius: 80px; border-bottom-right-radius: 80px; margin-bottom: 60px; } .hero-title { font-size: 4.5rem; }
        {% else %} .hero-section { padding: 80px 0; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; margin-bottom: 50px; } .hero-title { font-size: 3rem; } {% endif %}

        .hero-section { background: linear-gradient(135deg, var(--main-color), #2b2b2b); color: white; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .product-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .product-img { height: 200px; object-fit: cover; width: 100%; border-top-left-radius: 15px; border-top-right-radius: 15px;}
        .btn-custom { background-color: var(--main-color); color: white; font-weight: bold; }
        #floating-cart { position: fixed; bottom: 20px; left: 20px; background-color: var(--main-color); color: white; border-radius: 50px; padding: 15px 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000; font-weight: bold; font-size: 1.1rem; display: none; transition: transform 0.2s;}
        #floating-cart:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <h1 class="fw-bold hero-title">{{ settings.store_name }}</h1>
            <p class="lead" style="opacity: 0.9;">{{ settings.store_desc }}</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row">
            {% for p in products %}
            <div class="col-md-3 col-6 mb-4">
                <div class="card product-card h-100">
                    <img src="{{ p.image_url if p.image_url else 'https://via.placeholder.com/400x300?text=بدون+صورة' }}" class="product-img">
                    <div class="card-body p-3 d-flex flex-column">
                        <span class="badge bg-light text-dark border mb-2 align-self-start">{{ p.category }}</span>
                        <h6 class="fw-bold">{{ p.name }}</h6>
                        <h5 class="text-primary fw-bold mt-auto mb-3">{{ p.price }} <small class="text-muted fs-6">{{ settings.currency }}</small></h5>
                        <button class="btn btn-custom w-100 btn-sm mt-auto" onclick="addToCart('{{ p.name }}', {{ p.price }})">🛒 أضف للسلة</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- السلة العائمة -->
    <div id="floating-cart" onclick="openCartModal()">
        🛒 السلة (<span id="cart-count">0</span>) | الإجمالي: <span id="cart-total">0</span>
    </div>

    <!-- نافذة الدفع وتعديل السلة -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold text-dark">مراجعة سلة المشتريات</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <ul id="cart-items" class="list-group mb-4"></ul>
                    <div class="d-flex justify-content-between align-items-center mb-4 bg-light p-3 rounded">
                        <h5 class="fw-bold mb-0">المبلغ الإجمالي:</h5>
                        <h4 class="fw-bold text-primary mb-0"><span id="modal-total">0</span> <small class="fs-6 text-muted">{{ settings.currency }}</small></h4>
                    </div>
                    <h6 class="fw-bold mb-3">بيانات التوصيل والتواصل:</h6>
                    <input type="text" id="customer-name" class="form-control form-control-lg mb-3" placeholder="الاسم الكامل" required>
                    <input type="tel" id="customer-phone" class="form-control form-control-lg mb-4" placeholder="رقم الهاتف (للاتصال بك)" required>
                    <button id="btn-submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm" onclick="checkout()">تأكيد وإرسال الطلب 💬</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cart = [];
        let cartModalInstance = null;

        document.addEventListener("DOMContentLoaded", function(){
            cartModalInstance = new bootstrap.Modal(document.getElementById('cartModal'));
        });
        
        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if(item) { item.qty++; } else { cart.push({name: name, price: price, qty: 1}); }
            updateCartUI();
            
            // تأثير حركي خفيف على السلة
            let fCart = document.getElementById('floating-cart');
            fCart.style.transform = 'scale(1.1)';
            setTimeout(() => fCart.style.transform = 'scale(1)', 200);
        }

        // دالة جديدة للتحكم بالكمية (+ و -)
        function changeQty(name, delta) {
            let item = cart.find(i => i.name === name);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) {
                    cart = cart.filter(i => i.name !== name); // حذف المنتج إذا أصبحت الكمية 0
                }
            }
            updateCartUI();
            renderModalItems(); // تحديث النافذة المفتوحة
        }

        function updateCartUI() {
            let count = 0; let total = 0;
            cart.forEach(item => { count += item.qty; total += (item.price * item.qty); });
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
            document.getElementById('modal-total').innerText = total;
            document.getElementById('floating-cart').style.display = count > 0 ? 'block' : 'none';
            if(count === 0 && cartModalInstance) cartModalInstance.hide();
        }

        function renderModalItems() {
            let list = document.getElementById('cart-items');
            list.innerHTML = '';
            cart.forEach((item) => {
                list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center border-0 border-bottom pb-3 mb-2">
                    <div>
                        <h6 class="mb-1 fw-bold">${item.name}</h6>
                        <small class="text-muted">${item.price} {{ settings.currency }}</small>
                    </div>
                    <div class="d-flex align-items-center bg-light rounded p-1">
                        <button class="btn btn-sm btn-outline-danger border-0 px-2 py-0 fs-5" onclick="changeQty('${item.name}', -1)">−</button>
                        <span class="mx-3 fw-bold fs-6">${item.qty}</span>
                        <button class="btn btn-sm btn-outline-success border-0 px-2 py-0 fs-5" onclick="changeQty('${item.name}', 1)">+</button>
                    </div>
                </li>`;
            });
        }

        function openCartModal() {
            renderModalItems();
            cartModalInstance.show();
        }

        function checkout() {
            let name = document.getElementById('customer-name').value;
            let phone = document.getElementById('customer-phone').value;
            if(!name || !phone) return alert("يرجى إدخال الاسم ورقم الهاتف لضمان توصيل طلبك.");
            
            let btn = document.getElementById('btn-submit');
            btn.innerText = "جاري تحويلك للواتساب..."; btn.disabled = true;
            
            let total = document.getElementById('modal-total').innerText;
            
            fetch('/api/checkout/{{ user.store_slug }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, phone: phone, cart: cart, total: total})
            })
            .then(res => res.json())
            .then(data => {
                cart = []; updateCartUI();
                btn.innerText = "تأكيد وإرسال الطلب 💬"; btn.disabled = false;
                cartModalInstance.hide();
                window.open(data.whatsapp_url, '_blank');
            });
        }
    </script>
</body>
</html>
