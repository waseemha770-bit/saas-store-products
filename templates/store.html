<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.store_name }}</title>
    <!-- استدعاء الخط المختار ديناميكياً من جوجل فونتس -->
    <link href="https://fonts.googleapis.com/css2?family={{ settings.font_family|default('Cairo') }}:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        :root { --main-color: {{ settings.theme_color|default('#0d6efd') }}; }
        body { 
            font-family: '{{ settings.font_family|default('Cairo') }}', sans-serif; 
            background-color: #f9fbfd; 
        }
        
        /* التحكم بحجم رأس المتجر بناءً على الإعدادات */
        {% if settings.header_size == 'small' %}
            .hero-section { padding: 40px 0; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; margin-bottom: 30px; }
            .hero-title { font-size: 2rem; }
        {% elif settings.header_size == 'large' %}
            .hero-section { padding: 120px 0; border-bottom-left-radius: 80px; border-bottom-right-radius: 80px; margin-bottom: 60px; }
            .hero-title { font-size: 4.5rem; }
        {% else %}
            .hero-section { padding: 80px 0; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; margin-bottom: 50px; }
            .hero-title { font-size: 3rem; }
        {% endif %}

        .hero-section { background: linear-gradient(135deg, var(--main-color), #2b2b2b); color: white; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: all 0.3s;}
        .product-card { transition: transform 0.3s ease, box-shadow 0.3s ease; border: none; border-radius: 15px; overflow: hidden; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .product-img { height: 250px; object-fit: cover; width: 100%; }
        .btn-custom { background-color: var(--main-color); color: white; border: none; border-radius: 8px; font-weight: bold; }
        .btn-custom:hover { opacity: 0.9; color: white; transform: scale(1.02); }
        .price-tag { color: var(--main-color); font-weight: 800; font-size: 1.4rem; }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <h1 class="fw-bold hero-title mb-3">{{ settings.store_name }}</h1>
            <p class="lead" style="opacity: 0.9;">{{ settings.store_desc }}</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row">
            {% for product in products %}
            <div class="col-md-4 col-sm-6 mb-4">
                <div class="card product-card shadow-sm">
                    <img src="{{ product.image_url if product.image_url else 'https://via.placeholder.com/400x300?text=بدون+صورة' }}" class="product-img" alt="{{ product.name }}">
                    <div class="card-body p-4">
                        <span class="badge bg-light text-dark mb-2 border">{{ product.category }}</span>
                        <h4 class="card-title fw-bold mb-2">{{ product.name }}</h4>
                        <p class="card-text text-muted small mb-4" style="height: 40px; overflow: hidden;">{{ product.description }}</p>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="price-tag">{{ product.price }} <span class="fs-6 text-muted">{{ settings.currency }}</span></span>
                        </div>
                        <a href="https://wa.me/{{ settings.whatsapp }}?text=مرحباً، أريد طلب هذا المنتج: {{ product.name }}" target="_blank" class="btn btn-custom w-100 py-2">
                            {{ settings.btn_text }}
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
