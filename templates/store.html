<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.c1 }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary">{{ settings.c1 }}</h1>
            <p class="text-muted">{{ settings.c2 }}</p>
        </div>
        <h3 class="mb-4">منتجات المتجر</h3>
        <div class="row">
            {% for product in products %}
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm border-0">
                    {% if product.image_url %}
                    <img src="{{ product.image_url }}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="product">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ product.name }}</h5>
                        <p class="card-text text-muted small">{{ product.description }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-success fw-bold fs-5">{{ product.price }} ريال</span>
                            <span class="badge bg-secondary">{{ product.category }}</span>
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center text-muted py-5">
                <h4>لا توجد منتجات مضافة حتى الآن في هذا المتجر.</h4>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
