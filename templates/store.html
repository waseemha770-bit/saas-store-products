<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.store_name }}</title>
    <link rel="manifest" href="/manifest/{{ user.store_slug }}.json">
    <meta name="theme-color" content="{{ settings.theme_color|default('#0d6efd') }}">
    <script>function fixImg(img){if(!img.dataset.proxied){img.dataset.proxied='true';let src=img.getAttribute('src');if(src&&src!==''&&!src.includes('placeholder')){img.src='https://wsrv.nl/?url='+encodeURIComponent(img.src);}}}</script>
    <link href="https://fonts.googleapis.com/css2?family={{ settings.font_family|default('Cairo') }}:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    


<script>
function applySubFilter(btn) {
    let ul = btn.closest('.nav-pills');
    ul.querySelectorAll('.nav-link').forEach(b => {
        b.classList.remove('active', 'text-white', 'bg-primary');
        b.classList.add('text-secondary', 'bg-white');
    });
    btn.classList.remove('text-secondary', 'bg-white');
    btn.classList.add('active', 'text-white', 'bg-primary');

    let filterValue = btn.getAttribute('data-filter');
    let tabPane = btn.closest('.tab-pane');
    let products = tabPane.querySelectorAll('.product-item');

    products.forEach(p => {
        if (filterValue === 'all' || p.getAttribute('data-subcat') === filterValue) {
            p.classList.remove('d-none');
        } else {
            p.classList.add('d-none');
        }
    });
}
</script>
<style>
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.subcategories-wrapper { margin-top: 5px; margin-bottom: 20px; }
.nav-pills .nav-link { transition: all 0.2s ease-in-out; border-color: #dee2e6!important; }
.nav-pills .nav-link:hover { transform: translateY(-2px); }
</style>

</html>
