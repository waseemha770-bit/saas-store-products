<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لوحة التحكم | TajerGo{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background: #212529; color: #fff; padding-top: 20px; }
        .sidebar .nav-link { color: #adb5bd; text-decoration: none; padding: 12px 15px; display: block; border-radius: 5px; margin-bottom: 5px; transition: 0.2s; font-weight: 600; cursor: pointer; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #0d6efd; }
        .form-control, .form-select { border: 2px solid #b3b3b3; border-radius: 8px; font-weight: bold; }
        .form-control:focus, .form-select:focus { border-color: #0d6efd; box-shadow: none; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark d-md-none px-3 shadow">
        <a class="navbar-brand fw-bold" href="/dashboard"><i class="fas fa-store me-2"></i> TajerGo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- القائمة الجانبية تعمل كأزرار تبويبات (Tabs) -->
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky">
                    <h4 class="text-white text-center d-none d-md-block mb-4 border-bottom pb-3"><i class="fas fa-store me-2"></i> TajerGo</h4>
                    <ul class="nav flex-column px-2" role="tablist" id="sidebarTabs">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#analytics" role="tab"><i class="fas fa-chart-pie me-2"></i> الإحصائيات</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#orders" role="tab"><i class="fas fa-box-open me-2"></i> الطلبات</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#products" role="tab"><i class="fas fa-tags me-2"></i> المنتجات</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#drivers-pane" role="tab"><i class="fas fa-motorcycle me-2"></i> المناديب</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#coupons" role="tab"><i class="fas fa-ticket-alt me-2"></i> الكوبونات</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#settings" role="tab"><i class="fas fa-cog me-2"></i> الإعدادات</a></li>
                        {% if is_super_admin %}
                        <li class="nav-item"><a class="nav-link text-danger" data-bs-toggle="tab" href="#superadmin" role="tab"><i class="fas fa-crown me-2"></i> الإدارة</a></li>
                        {% endif %}
                        <li class="nav-item mt-4"><a class="nav-link text-danger" href="/logout"><i class="fas fa-sign-out-alt me-2"></i> خروج</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
