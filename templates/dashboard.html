<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between mb-4">
            <h2>لوحة تحكم المتجر</h2>
            <a href="/logout" class="btn btn-danger">تسجيل الخروج</a>
        </div>
        <form method="POST" class="row g-2 mb-4">
            <input name="name" class="form-control mb-2" placeholder="اسم المنتج" required>
            <input name="price" class="form-control mb-2" placeholder="السعر" required>
            <input name="desc" class="form-control mb-2" placeholder="الوصف">
            <input name="cat" class="form-control mb-2" placeholder="التصنيف">
            <input name="img" class="form-control mb-2" placeholder="رابط الصورة">
            <button class="btn btn-success">إضافة المنتج</button>
        </form>
        <h3>منتجاتك:</h3>
        <ul class="list-group">
            {% for p in products %}<li class="list-group-item fw-bold">{{p.c1}} <span class="text-success mx-2">{{p.c3}}</span></li>{% endfor %}
        </ul>
    </div>
</body>
</html>
